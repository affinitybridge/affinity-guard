name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

  standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr

      # phpcodesniffer-composer-installer is a Composer plugin, and Composer 2.2
      # refuses to run plugins that are not explicitly allowed. Without this the
      # require below aborts before anything is installed.
      - name: Allow the PHPCS installer plugin
        run: composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install PHPCS and WPCS
        run: composer global require --no-interaction --no-progress dealerdirect/phpcodesniffer-composer-installer wp-coding-standards/wpcs:^3

      - name: Run PHPCS
        run: ~/.composer/vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml || true

      - name: Annotate
        if: always()
        run: cs2pr ./phpcs-report.xml
